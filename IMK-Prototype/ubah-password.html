<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ubah Password — OMI</title>
  <meta name="description" content="Ubah password akun OMI.">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/akun.css">
</head>
<body>

  <!-- Frame 15 Ubah Password (node 141:546) -->
  <header id="omi-navbar"></header>

  <main class="omi-page">

    <section class="omi-card omi-pw-card">
      <h1 class="omi-card-title">Ubah Password</h1>
      <p class="omi-text-sm omi-text-muted omi-mt-8">
        Gunakan kombinasi huruf dan angka agar lebih aman.
      </p>

      <form class="omi-mt-32" id="form-password" novalidate>
        <div class="omi-form-stack">
          <div class="omi-field">
            <label class="omi-label" for="lama">Password Lama</label>
            <input class="omi-input" type="password" id="lama" name="lama"
                   autocomplete="current-password" placeholder="••••••••">
          </div>

          <div class="omi-field">
            <label class="omi-label" for="baru">Password Baru</label>
            <input class="omi-input" type="password" id="baru" name="baru"
                   autocomplete="new-password" placeholder="••••••••">
          </div>

          <div class="omi-field">
            <label class="omi-label" for="konfirmasi">Konfirmasi Password Baru</label>
            <input class="omi-input" type="password" id="konfirmasi" name="konfirmasi"
                   autocomplete="new-password" placeholder="••••••••">
          </div>
        </div>

        <p class="omi-alert omi-alert--danger omi-hidden omi-mt-24" id="form-error" role="alert"></p>
        <p class="omi-alert omi-alert--success omi-hidden omi-mt-24" id="form-sukses" role="status"></p>

        <div class="omi-pw-footer">
          <a class="omi-btn omi-btn--ghost" href="akun-saya.html">Batal</a>
          <button type="submit" class="omi-btn omi-btn--primary omi-btn--lg">Simpan Password</button>
        </div>
      </form>
    </section>

  </main>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/page-password.js"></script>
</body>
</html>
